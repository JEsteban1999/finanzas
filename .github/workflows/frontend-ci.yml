name: frontend
on:
  push:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/frontend-ci.yml"]
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas_test
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U finanzas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UV_CMD: uv
      E2E_ADMIN_URL: postgresql+psycopg://finanzas:finanzas@localhost:5434/finanzas_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
