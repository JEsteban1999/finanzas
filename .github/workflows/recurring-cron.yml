name: recurring-job
on:
  schedule:
    - cron: "0 11 * * *"  # 06:00 America/Bogota
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Generar movimientos recurrentes pendientes
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}" \
            "${{ secrets.BACKEND_URL }}/internal/jobs/recurring"
